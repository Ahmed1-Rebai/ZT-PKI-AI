---
# Role: sensor — live anomaly scoring (M5 · docs/07 §8).
# Captures the gateway's mirrored traffic (zt-mirror) with NFStream, scores
# flows with the signed models trained on the host GPU, reports to the PDP.

- name: Install runtime packages
  ansible.builtin.apt:
    name: [python3-venv, python3-pip, libpcap0.8]
    state: present
    update_cache: true

- name: Create the service account
  ansible.builtin.user:
    name: "{{ zt_ai_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Check trained models and AI identity exist (on the control node)
  ansible.builtin.stat:
    path: "{{ zt_repo_root }}/ai/{{ item }}"
  delegate_to: localhost
  become: false
  register: zt_ai_material
  loop: [models/manifest.json, models/baseline.joblib, models/ae.pt, certs/ai.crt, certs/ai.key, certs/ca-chain.crt]

- name: Require models and identity
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: "Missing ai/{{ item.item }} — train (ai/train.py) and stage ai/certs first."
  loop: "{{ zt_ai_material.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Create AI directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: "{{ zt_ai_user }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ zt_ai_dir }}", mode: "0755"}
    - {path: "{{ zt_ai_dir }}/models", mode: "0750"}
    - {path: "{{ zt_ai_dir }}/certs", mode: "0750"}

- name: Create the Python environment (recent pip avoids source builds)
  ansible.builtin.pip:
    name: [pip, wheel]
    state: latest
    virtualenv: "{{ zt_ai_dir }}/.venv"
    virtualenv_command: python3 -m venv

- name: Install torch (CPU build; other dependencies from PyPI)
  ansible.builtin.pip:
    name: "{{ zt_ai_torch }}"
    virtualenv: "{{ zt_ai_dir }}/.venv"
    extra_args: "--extra-index-url {{ zt_ai_torch_index }}"

- name: Install pinned ML libraries
  ansible.builtin.pip:
    name: "{{ zt_ai_pip }}"
    virtualenv: "{{ zt_ai_dir }}/.venv"

- name: Deploy engine code
  ansible.builtin.copy:
    src: "{{ zt_repo_root }}/ai/{{ item }}"
    dest: "{{ zt_ai_dir }}/{{ item }}"
    mode: "0644"
  loop: [schema.py, models.py, registry.py, scoring.py, pdp_client.py, serve.py]
  notify: restart zt-ai

- name: Deploy signed models (verified again at load)
  ansible.builtin.copy:
    src: "{{ zt_repo_root }}/ai/models/{{ item }}"
    dest: "{{ zt_ai_dir }}/models/{{ item }}"
    owner: root
    group: "{{ zt_ai_user }}"
    mode: "0640"
  loop: [manifest.json, baseline.joblib, ae.pt]
  notify: restart zt-ai

- name: Deploy the AI mTLS identity
  ansible.builtin.copy:
    src: "{{ zt_repo_root }}/ai/certs/{{ item.f }}"
    dest: "{{ zt_ai_dir }}/certs/{{ item.f }}"
    owner: root
    group: "{{ zt_ai_user }}"
    mode: "{{ item.m }}"
  loop:
    - {f: ca-chain.crt, m: "0644"}
    - {f: ai.crt, m: "0644"}
    - {f: ai.key, m: "0640"}
  notify: restart zt-ai

- name: Resolve the capture interface from the zt-mirror address
  ansible.builtin.shell: ip -o -4 addr show | awk -v a="{{ zt_mirror_ip }}/" 'index($4, a) == 1 {print $2; exit}'
  register: zt_capture_if
  changed_when: false
  failed_when: zt_capture_if.stdout | length == 0

- name: Create the AI event log directory
  ansible.builtin.file:
    path: /var/log/zt-ai
    state: directory
    owner: "{{ zt_ai_user }}"
    group: "{{ zt_ai_user }}"
    mode: "0750"

- name: Install the scoring service
  ansible.builtin.copy:
    dest: /etc/systemd/system/zt-ai.service
    mode: "0644"
    content: |
      [Unit]
      Description=ZT anomaly engine — live scoring of mirrored traffic
      After=network-online.target
      Wants=network-online.target

      [Service]
      User={{ zt_ai_user }}
      Group={{ zt_ai_user }}
      WorkingDirectory={{ zt_ai_dir }}
      Environment=ZT_CAPTURE_IF={{ zt_capture_if.stdout }}
      Environment=ZT_PDP_URL=https://{{ pdp_ip }}:8443
      ExecStart={{ zt_ai_dir }}/.venv/bin/python {{ zt_ai_dir }}/serve.py
      # JSON events -> file collected by the Wazuh agent (opened by systemd)
      StandardOutput=append:/var/log/zt-ai/events.jsonl
      StandardError=journal
      # Packet capture only; no root.
      AmbientCapabilities=CAP_NET_RAW CAP_NET_ADMIN
      CapabilityBoundingSet=CAP_NET_RAW CAP_NET_ADMIN
      NoNewPrivileges=true
      ProtectSystem=strict
      ProtectHome=true
      PrivateTmp=true
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
  notify: restart zt-ai

- name: Enable the scoring service
  ansible.builtin.systemd:
    name: zt-ai
    enabled: true
    state: started
    daemon_reload: true

# --- Suricata 7 IDS on the mirror (M6 · docs/08 §3) -------------------------

- name: Enable bookworm-backports (Suricata 7)
  ansible.builtin.apt_repository:
    repo: "deb http://deb.debian.org/debian bookworm-backports main"
    filename: backports
    state: present

- name: Install Suricata 7 and the rule updater
  ansible.builtin.apt:
    name: [suricata, suricata-update]
    default_release: bookworm-backports
    state: present
    update_cache: true

- name: Deploy ZT local rules
  ansible.builtin.copy:
    src: "{{ zt_repo_root }}/sensor/local.rules"
    dest: /var/lib/suricata/rules/local.rules
    mode: "0644"
  notify: restart suricata

- name: Deploy ZT overrides (HOME_NET, mirror interface, rule files)
  ansible.builtin.copy:
    dest: /etc/suricata/zt.yaml
    mode: "0644"
    content: |
      %YAML 1.1
      ---
      af-packet:
        - interface: {{ zt_capture_if.stdout }}
          cluster-id: 99
          cluster-type: cluster_flow
          defrag: yes
      default-rule-path: /var/lib/suricata/rules
      rule-files:
        - suricata.rules
        - local.rules
  notify: restart suricata

# HOME_NET is set in place: an included `vars:` map would replace the whole
# section and drop the default port groups the ET rules rely on.
- name: Set HOME_NET to the lab zones and VPN pool
  ansible.builtin.replace:
    path: /etc/suricata/suricata.yaml
    regexp: '^(\s*)HOME_NET:.*$'
    replace: '\1HOME_NET: "[10.8.0.0/24,10.10.0.0/16,192.168.100.0/24]"'
  notify: restart suricata

- name: Include the ZT overrides from suricata.yaml
  ansible.builtin.lineinfile:
    path: /etc/suricata/suricata.yaml
    line: "include: zt.yaml"
  notify: restart suricata

- name: Fetch Emerging Threats Open rules (suricata-update)
  ansible.builtin.command: suricata-update --no-test
  args:
    creates: /var/lib/suricata/rules/suricata.rules
  notify: restart suricata

- name: Validate the Suricata configuration
  ansible.builtin.command: suricata -T -c /etc/suricata/suricata.yaml
  changed_when: false

- name: Enable Suricata
  ansible.builtin.systemd:
    name: suricata
    enabled: true
    state: started
