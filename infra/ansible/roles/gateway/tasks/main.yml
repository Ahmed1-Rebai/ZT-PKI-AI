---
# Role: gateway — M2/M3 · docs/05 + docs/06 §6
# OpenVPN (TLS1.3 mTLS, tls-crypt, crl-verify, no pushed routes) + nftables
# deny-by-default forward chain with dynamic timeout sets + Zero Trust hooks.
#
# Configs live in the repo (vpn/, firewall/) and are copied here; the PKI
# material is staged by vpn/scripts/sync-pki.sh (never committed).

- name: Install gateway packages
  ansible.builtin.apt:
    name:
      - openvpn
      - nftables
      - openssl
      - netcat-openbsd
      - python3
    state: present
    update_cache: true

- name: Create OpenVPN / nftables directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/openvpn/server
    - /etc/openvpn/hooks
    - /etc/openvpn/zt
    - /etc/nftables.d
    - /var/log/openvpn

# --- PKI material (staged from sub-ca) -------------------------------------

- name: Check staged PKI material exists (on the control node)
  ansible.builtin.stat:
    path: "{{ zt_repo_root }}/vpn/server/pki/{{ item }}"
  delegate_to: localhost
  become: false
  register: zt_gw_pki
  loop: [ca-chain.crt, vpn-gw.crt, vpn-gw.key, crl.pem]

- name: Fail if PKI staging is incomplete
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: "Missing {{ item.item }} — run vpn/scripts/sync-pki.sh first."
  loop: "{{ zt_gw_pki.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Deploy OpenVPN server config
  ansible.builtin.copy:
    src: "{{ zt_repo_root }}/vpn/server/server.conf"
    dest: /etc/openvpn/server/server.conf
    mode: "0644"
  notify: restart openvpn

- name: Deploy PKI material
  ansible.builtin.copy:
    src: "{{ zt_repo_root }}/vpn/server/pki/{{ item.src }}"
    dest: "/etc/openvpn/server/{{ item.dest }}"
    mode: "{{ item.mode }}"
  loop:
    - { src: ca-chain.crt, dest: ca-chain.crt, mode: "0644" }
    - { src: vpn-gw.crt,   dest: vpn-gw.crt,   mode: "0644" }
    - { src: vpn-gw.key,   dest: vpn-gw.key,   mode: "0600" }
    - { src: crl.pem,      dest: crl.pem,      mode: "0644" }
  loop_control:
    label: "{{ item.dest }}"
  notify: restart openvpn

# tls-crypt key: the staged copy (vpn/server/ta.key) is the source of truth, so
# a rebuilt gateway keeps the key already embedded in client profiles. A key is
# generated only on first deployment, then fetched by vpn/scripts/sync-pki.sh.
- name: Check for a staged tls-crypt key (on the control node)
  ansible.builtin.stat:
    path: "{{ zt_repo_root }}/vpn/server/ta.key"
  delegate_to: localhost
  become: false
  register: zt_staged_ta

- name: Deploy the staged tls-crypt key
  ansible.builtin.copy:
    src: "{{ zt_repo_root }}/vpn/server/ta.key"
    dest: /etc/openvpn/server/ta.key
    owner: root
    group: root
    mode: "0600"
  when: zt_staged_ta.stat.exists
  notify: restart openvpn

- name: Generate the tls-crypt key (first deployment only)
  ansible.builtin.command:
    cmd: openvpn --genkey secret /etc/openvpn/server/ta.key
    creates: /etc/openvpn/server/ta.key
  when: not zt_staged_ta.stat.exists
  notify: restart openvpn

# --- Zero Trust hooks ------------------------------------------------------

- name: Deploy Zero Trust hooks
  ansible.builtin.copy:
    src: "{{ zt_repo_root }}/vpn/hooks/{{ item }}"
    dest: "/etc/openvpn/hooks/{{ item }}"
    mode: "0755"
  loop: [zt_common.py, tls-verify.py, client-connect.py, client-disconnect.py]
  notify: restart openvpn

- name: Deploy hook configuration
  ansible.builtin.copy:
    src: "{{ zt_repo_root }}/vpn/hooks/hook.env.example"
    dest: /etc/openvpn/zt/hook.env
    mode: "0644"
  notify: restart openvpn

- name: Set PDP enforcement mode
  ansible.builtin.lineinfile:
    path: /etc/openvpn/zt/hook.env
    regexp: '^PDP_ENFORCE='
    line: "PDP_ENFORCE={{ vpn_pdp_enforce }}"
  notify: restart openvpn

- name: Deploy fixed VPN IP map
  ansible.builtin.copy:
    src: "{{ zt_repo_root }}/vpn/zt/ip-map.csv"
    dest: /etc/openvpn/zt/ip-map.csv
    mode: "0644"

# M3: the PDP is on a separate VM, so it receives a deliberately restricted
# SSH identity rather than a general root shell on the PEP.
- name: Create the restricted PDP gateway account
  ansible.builtin.user:
    name: ztpdp
    system: true
    # Its key has a forced command below; nologin would also reject SSH exec.
    shell: /bin/sh
    create_home: true

- name: Install the restricted PDP nftables helper
  ansible.builtin.copy:
    src: "{{ zt_repo_root }}/firewall/ztpdp-nft"
    dest: /usr/local/sbin/ztpdp-nft
    owner: root
    group: root
    mode: "0755"

- name: Install the forced SSH command for the PDP key
  ansible.builtin.copy:
    src: "{{ zt_repo_root }}/firewall/ztpdp-ssh"
    dest: /usr/local/sbin/ztpdp-ssh
    owner: root
    group: root
    mode: "0755"

- name: Permit the PDP helper only (no interactive sudo)
  ansible.builtin.copy:
    dest: /etc/sudoers.d/ztpdp-nft
    content: "ztpdp ALL=(root) NOPASSWD: /usr/local/sbin/ztpdp-nft *\n"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

- name: Check staged PDP gateway public key exists when enforcement is enabled
  ansible.builtin.stat:
    path: "{{ zt_repo_root }}/pdp/ssh/id_ed25519.pub"
  delegate_to: localhost
  become: false
  register: zt_pdp_gateway_pubkey
  when: vpn_pdp_enforce | string == '1'

- name: Create the restricted PDP SSH directory
  ansible.builtin.file:
    path: /home/ztpdp/.ssh
    state: directory
    owner: ztpdp
    group: ztpdp
    mode: "0700"
  when: vpn_pdp_enforce | string == '1'

- name: Authorize the PDP restricted key when enforcement is enabled
  ansible.builtin.lineinfile:
    path: /home/ztpdp/.ssh/authorized_keys
    line: "command=\"/usr/local/sbin/ztpdp-ssh\",no-port-forwarding,no-X11-forwarding,no-agent-forwarding,no-pty {{ lookup('file', zt_repo_root + '/pdp/ssh/id_ed25519.pub') }}"
    create: true
    owner: ztpdp
    group: ztpdp
    mode: "0600"
  when:
    - vpn_pdp_enforce | string == '1'
    - zt_pdp_gateway_pubkey.stat.exists

- name: Check staged gateway mTLS material exists when enforcement is enabled
  ansible.builtin.stat:
    path: "{{ zt_repo_root }}/pdp/certs/{{ item }}"
  delegate_to: localhost
  become: false
  register: zt_gateway_pdp_mtls
  loop: [ca-chain.crt, gw-client.crt, gw-client.key]
  when: vpn_pdp_enforce | string == '1'

- name: Require gateway mTLS material when enforcement is enabled
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: "Missing pdp/certs/{{ item.item }}. Run pdp/scripts/sync-pki.sh after issuing gw-client."
  loop: "{{ zt_gateway_pdp_mtls.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: vpn_pdp_enforce | string == '1'

- name: Deploy gateway mTLS material for PDP calls
  ansible.builtin.copy:
    src: "{{ zt_repo_root }}/pdp/certs/{{ item.src }}"
    dest: "/etc/openvpn/hooks/{{ item.dest }}"
    owner: root
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {src: ca-chain.crt, dest: ca-chain.crt, group: root, mode: '0644'}
    - {src: gw-client.crt, dest: gw-client.crt, group: root, mode: '0644'}
    # OpenVPN hooks run as nobody:nogroup; do not make the client key world-readable.
    - {src: gw-client.key, dest: gw-client.key, group: nogroup, mode: '0640'}
  when: vpn_pdp_enforce | string == '1'
  notify: restart openvpn

# --- Routing + firewall ----------------------------------------------------

- name: Enable IP forwarding (gateway routes between zones)
  ansible.builtin.copy:
    dest: /etc/sysctl.d/91-zt-gw.conf
    content: "net.ipv4.ip_forward = 1\n"
    mode: "0644"
  notify: reload sysctl

- name: Deploy nftables main ruleset
  ansible.builtin.copy:
    src: "{{ zt_repo_root }}/firewall/nftables.conf"
    dest: /etc/nftables.conf
    mode: "0644"
  notify: reload nftables

- name: Deploy nftables host input chain
  ansible.builtin.copy:
    src: "{{ zt_repo_root }}/firewall/gw-input.nft"
    dest: /etc/nftables.d/gw-input.nft
    mode: "0644"
  notify: reload nftables

- name: Validate the nftables ruleset
  ansible.builtin.command:
    cmd: nft -c -f /etc/nftables.conf
  changed_when: false

# --- Services --------------------------------------------------------------

- name: Enable and start nftables
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started

- name: Enable and start OpenVPN server
  ansible.builtin.systemd:
    name: openvpn-server@server
    enabled: true
    state: started

# --- Traffic mirror for the sensor (M5 · docs/08 §3) -----------------------
# VirtualBox has no switch port mirroring: copy the server-side zone NICs
# (dmz, app, data, mgmt) onto the dedicated zt-mirror NIC with tc mirred.
# Client traffic there is already decrypted and keeps its tunnel source IP
# (no NAT), so the sensor can attribute every flow to an identity.

- name: Install the mirror script
  ansible.builtin.copy:
    src: "{{ zt_repo_root }}/sensor/mirror.sh"
    dest: /usr/local/sbin/zt-mirror.sh
    owner: root
    group: root
    mode: "0755"

- name: Resolve zone and mirror interfaces by address
  ansible.builtin.shell: |
    set -e
    ifc() { ip -o -4 addr show | awk -v a="$1/" 'index($4, a) == 1 {print $2; exit}'; }
    src=""
    for a in 10.10.10.1 10.10.20.1 10.10.30.1 10.10.99.1; do src="$src $(ifc $a)"; done
    echo "SRC_IFACES=\"$(echo $src)\""
    echo "MIRROR_IF=$(ifc 10.10.98.1)"
  args:
    executable: /bin/bash
  register: zt_mirror_env
  changed_when: false
  failed_when: "'MIRROR_IF=' not in zt_mirror_env.stdout or zt_mirror_env.stdout is search('MIRROR_IF=$')"

- name: Write mirror configuration
  ansible.builtin.copy:
    dest: /etc/default/zt-mirror
    content: "{{ zt_mirror_env.stdout }}\n"
    mode: "0644"
  register: zt_mirror_conf

- name: Install the mirror unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/zt-mirror.service
    mode: "0644"
    content: |
      [Unit]
      Description=ZT traffic mirror (zone NICs -> zt-mirror, for the sensor)
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      EnvironmentFile=/etc/default/zt-mirror
      ExecStart=/usr/local/sbin/zt-mirror.sh

      [Install]
      WantedBy=multi-user.target
  register: zt_mirror_unit

- name: Enable and (re)apply the mirror
  ansible.builtin.systemd:
    name: zt-mirror
    enabled: true
    daemon_reload: true
    state: "{{ 'restarted' if (zt_mirror_conf.changed or zt_mirror_unit.changed) else 'started' }}"
