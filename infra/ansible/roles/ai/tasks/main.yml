---
# Role: ai — local TRAINING environment on the host (docs/07)
# Prepares the project .venv used by ai/train.py (GPU). Dependencies:
#   .venv/bin/pip install -r infra/requirements.txt
# Inference does not run here: the sensor role deploys the engine, the signed
# models and the AI mTLS identity on zt-sensor (service zt-ai).
# This role targets localhost (see inventory [ai] + site.yml).

- name: AI host prerequisites (venv tooling)
  ansible.builtin.apt:
    name: [python3-venv, python3-pip]
    state: present
  become: true

- name: Create project venv on the host
  ansible.builtin.command:
    cmd: python3 -m venv {{ playbook_dir }}/../../.venv
    creates: "{{ playbook_dir }}/../../.venv"
  become: false
