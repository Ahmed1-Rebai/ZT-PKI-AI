---
# Role: ca_root — ensure OpenSSL tooling is present for the CA ceremony.
# The actual key generation / signing is run by hand via pki/scripts/*
# (encrypted keys prompt for a passphrase — deliberately not automated).
# See pki/README.md "Runbook (CA ceremony)".

- name: Install OpenSSL
  ansible.builtin.apt:
    name: [openssl]
    state: present
    update_cache: true
