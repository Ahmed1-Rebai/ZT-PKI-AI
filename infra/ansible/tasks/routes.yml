---
# Shared: persistent static routes to other zones via the gateway.
# Include from a role that defines `zt_routes` (list of "<net> via <gw>").
# A systemd oneshot works the same on Debian (ifupdown) and Ubuntu (netplan),
# and re-applies the routes at every boot.

- name: Install zt-routes unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/zt-routes.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=ZT lab static routes via the gateway
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      {% for r in zt_routes %}
      ExecStart=-/bin/sh -c 'ip route replace {{ r }}'
      {% endfor %}
      # Lab address space is reachable ONLY via explicit routes (zones via the
      # gateway, VPN /32s via tun0). Without this, the provisioning NAT adapter
      # would route 10.10.x.x to the host, which sits on mgmt (10.10.99.2) —
      # bypassing the gateway. More specific routes still win.
      ExecStart=/bin/sh -c 'ip route replace unreachable 10.10.0.0/16'

      [Install]
      WantedBy=multi-user.target
  register: zt_routes_unit

# `vagrant up` re-configures the private NICs after every boot (ifdown/ifup or
# `netplan apply`), which flushes the routes bound to them after zt-routes ran.
# Re-apply the routes whenever an interface comes up (ifupdown on Debian,
# networkd-dispatcher on Ubuntu). Each route line is non-fatal ("-" prefix), so a
# NIC that is not up yet does not stop the others; the next up-event retries.
- name: Hook directories for interface up-events
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop: [/etc/network/if-up.d, /etc/networkd-dispatcher/routable.d]

- name: Re-apply zt-routes when an interface comes up
  ansible.builtin.copy:
    dest: "{{ item }}"
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/bin/sh
      # Re-apply the ZT lab routes: Vagrant re-ups the private NICs on every boot.
      [ "${IFACE:-}" = lo ] && exit 0
      systemctl --no-block restart zt-routes.service 2>/dev/null || true
  loop: [/etc/network/if-up.d/zt-routes, /etc/networkd-dispatcher/routable.d/50-zt-routes]

- name: Enable and (re)apply zt-routes
  ansible.builtin.systemd:
    name: zt-routes
    enabled: true
    state: "{{ 'restarted' if zt_routes_unit.changed else 'started' }}"
    daemon_reload: "{{ zt_routes_unit.changed }}"
