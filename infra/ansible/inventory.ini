# Static inventory for the ZT-PKI-AI lab.
# Vagrant also auto-generates its own inventory; this file is used by the
# Vagrantfile provisioner (and for running playbooks by hand over the mgmt net
# once SSH keys are in place).

[ca_root]
root-ca

[ca_sub]
sub-ca    ansible_host=10.10.99.5

[gateway]
zt-gw     ansible_host=10.10.99.1

[pdp]
zt-pdp    ansible_host=10.10.99.10

[sensor]
zt-sensor ansible_host=10.10.99.12

# Local training environment on THIS host (GPU). Inference runs on zt-sensor.
[ai]
localhost ansible_connection=local ansible_host=10.10.99.2

[siem]
siem      ansible_host=10.10.99.20

[proxy]
web-proxy ansible_host=10.10.10.10

[webapp]
web-app   ansible_host=10.10.20.10

[db]
db        ansible_host=10.10.30.10

[client]
client-lin ansible_host=192.168.100.11

# Logical groupings
[control_plane:children]
ca_sub
pdp

[security:children]
sensor
ai
siem

[workloads:children]
proxy
webapp
db

[all:vars]
ansible_python_interpreter=/usr/bin/python3
