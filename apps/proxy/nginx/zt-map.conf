# Extract the Common Name from the client certificate subject DN.
# `$ssl_client_s_dn_cn` is not available on all nginx builds (e.g. Debian 12),
# so derive the CN with a map. Deployed to /etc/nginx/conf.d/zt-map.conf.
map $ssl_client_s_dn $zt_client_cn {
    default              "";
    ~*CN=([^,]+)          $1;
}
