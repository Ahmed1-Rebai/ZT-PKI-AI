# ZT-PKI-AI DMZ reverse proxy (web-proxy, 10.10.10.10:443) — docs/06 §7.
# Deployed by the `proxy` Ansible role to
#   /etc/nginx/sites-available/zt-proxy.conf
# mTLS: a valid client certificate from the Issuing CA is mandatory; the CRL is
# enforced; the certified CN/serial are forwarded to the app as headers.
#
# The proxy does not decide roles — network reachability is already role-gated
# by the gateway (PDP). Path-level policy (/portal = contractor-only) is applied
# by the app from the forwarded, proxy-certified CN.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name proxy.lab.local;

    ssl_certificate     /etc/nginx/zt/proxy.lab.local.crt;
    ssl_certificate_key /etc/nginx/zt/proxy.lab.local.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Client authentication: cert issued by the lab CA, not revoked via CRL.
    ssl_client_certificate /etc/nginx/zt/ca-chain.crt;
    ssl_crl                /etc/nginx/zt/crl.pem;
    ssl_verify_client      on;
    ssl_verify_depth       3;

    access_log /var/log/nginx/zt-proxy.access.log;
    error_log  /var/log/nginx/zt-proxy.error.log;

    # Certified identity, never a client-declared value ($zt_client_cn from
    # the map in zt-map.conf).
    proxy_set_header X-Client-CN      $zt_client_cn;
    proxy_set_header X-Client-Serial  $ssl_client_serial;
    proxy_set_header X-Client-Verify  $ssl_client_verify;
    proxy_set_header X-Client-Fingerprint $ssl_client_fingerprint;
    proxy_set_header Host             $host;
    proxy_set_header X-Real-IP        $remote_addr;

    location = /healthz {
        proxy_pass http://10.10.20.10:8080/healthz;
    }

    location / {
        proxy_pass http://10.10.20.10:8080;
    }
}
