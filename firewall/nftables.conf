#!/usr/sbin/nft -f
# ZT-PKI-AI gateway ruleset — deny-by-default transit (PEP) — docs/06 §6.
# Deployed to /etc/nftables.conf and loaded by nftables.service.
#
# The dynamic sets are populated at runtime by the PDP (pdp/enforce.py) with a
# TTL, which is what turns this static deny-by-default into continuous,
# identity-based authorization (M3). At M2 the sets are empty, so a connected
# VPN client can reach nothing — exactly the expected behaviour.

flush ruleset

include "/etc/nftables.d/gw-input.nft"

table inet zt {
  # Elements expire on their own: if the PDP dies, rights time out (ENF4).
  set allow_web   { type ipv4_addr; flags timeout; }
  set allow_ssh   { type ipv4_addr; flags timeout; }
  set allow_remed { type ipv4_addr; flags timeout; }
  set quarantine  { type ipv4_addr; flags timeout; }

  chain forward {
    type filter hook forward priority 0; policy drop;

    ct state established,related accept
    ct state invalid drop

    # 0. Posture channel: any tunnel client may reach the PDP API, so it can
    #    report posture (even from quarantine). The PDP binds the report to the
    #    client's tunnel address and refuses every control endpoint from here.
    ip saddr 10.8.0.0/24 ip daddr 10.10.99.10 tcp dport 8443 accept

    # 1. Quarantine takes precedence: only the remediation portal.
    ip saddr @quarantine ip daddr 10.10.99.30 tcp dport 443 accept
    ip saddr @quarantine log prefix "ZT-QUAR " level warn drop

    # 2. Role rights fed by the PDP (time-limited).
    ip saddr @allow_web ip daddr 10.10.10.10 tcp dport 443 accept
    ip saddr @allow_ssh ip daddr 10.10.20.10 tcp dport 22  accept

    # 3. Explicit server-to-server flows.
    ip saddr 10.10.10.10 ip daddr 10.10.20.10 tcp dport 8080 accept   # proxy -> app
    ip saddr 10.10.20.10 ip daddr 10.10.30.10 tcp dport 5432 accept   # app   -> db
    ip saddr 10.10.10.10 ip daddr 10.10.99.20 tcp dport { 1514, 1515 } accept   # proxy agent -> SIEM

    # 4. Everything else is logged and dropped.
    log prefix "ZT-DROP " level info limit rate 10/second
    counter
  }
}
