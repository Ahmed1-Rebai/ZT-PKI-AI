# ZT-PKI-AI — OpenVPN gateway (PEP) — docs/05 §3
# Deployed to /etc/openvpn/server/server.conf, started by systemd unit
# `openvpn-server@server`. Only /32 host routes to the published endpoints are
# pushed, so client traffic enters the tunnel; reachability is not access — the
# PDP decides and the PEP (nftables, deny-by-default) enforces (docs/06 §6).

port 1194
proto udp
dev tun
topology subnet
server 10.8.0.0 255.255.255.0
ifconfig-pool-persist /var/log/openvpn/ipp.txt

# --- Published endpoints (host routes only, no subnets) ---
push "route 10.10.10.10 255.255.255.255"   # web-proxy (mTLS app entry)
push "route 10.10.20.10 255.255.255.255"   # web-app SSH (admin-only; others hit ZT-DROP)
push "route 10.10.99.10 255.255.255.255"   # PDP posture channel (opened in nftables later)
push "route 10.10.99.30 255.255.255.255"   # reserved for a remediation service (none deployed)

# --- PKI (mTLS) ---
ca   /etc/openvpn/server/ca-chain.crt
cert /etc/openvpn/server/vpn-gw.crt
key  /etc/openvpn/server/vpn-gw.key
crl-verify /etc/openvpn/server/crl.pem
dh none
ecdh-curve prime256v1

# --- TLS hardening (TLS 1.3 only) ---
tls-version-min 1.3
tls-ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
data-ciphers AES-256-GCM:CHACHA20-POLY1305
data-ciphers-fallback AES-256-GCM
tls-crypt /etc/openvpn/server/ta.key        # drops unauthenticated scan/DoS packets
remote-cert-tls client                       # client EKU (clientAuth) required
verify-client-cert require
reneg-sec 3600
# no compression (VORACLE)
allow-compression no

# --- Zero Trust integration (fail-closed hooks) ---
script-security 2
tls-verify        /etc/openvpn/hooks/tls-verify.py
client-connect    /etc/openvpn/hooks/client-connect.py
client-disconnect /etc/openvpn/hooks/client-disconnect.py
management 127.0.0.1 7505

# --- Session ---
keepalive 10 60
persist-key
persist-tun
user nobody
group nogroup
status /var/log/openvpn/status.log 10
log-append /var/log/openvpn/openvpn.log
verb 3
explicit-exit-notify 1
